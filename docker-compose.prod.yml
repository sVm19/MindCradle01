services:
  backend:
    image: xuvm19/mindcradle-backend:latest
    container_name: mindcradle-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    expose:
      - "8080"
    networks:
      - app-network

  frontend:
    image: xuvm19/mindcradle-frontend:latest
    container_name: mindcradle-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - BACKEND_ORIGIN=http://backend:8080
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
