name: Build and Push Images

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "prerender.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build, Scan & Push (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image repository names (lowercase)
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${REPO_LOWER}/backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${REPO_LOWER}/frontend" >> $GITHUB_ENV
          echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build backend image
        run: |
          docker build \
            -t ${BACKEND_IMAGE}:${COMMIT_SHA} \
            -t ${BACKEND_IMAGE}:latest \
            -f backend/Dockerfile backend

      - name: Build frontend image
        run: |
          docker build \
            -t ${FRONTEND_IMAGE}:${COMMIT_SHA} \
            -t ${FRONTEND_IMAGE}:latest \
            -f frontend/Dockerfile .

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.COMMIT_SHA }}
          format: "table"
          severity: "CRITICAL,HIGH"
        continue-on-error: true

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.COMMIT_SHA }}
          format: "table"
          severity: "CRITICAL,HIGH"
        continue-on-error: true

      - name: Push backend image
        run: |
          docker push ${BACKEND_IMAGE}:${COMMIT_SHA}
          docker push ${BACKEND_IMAGE}:latest

      - name: Push frontend image
        run: |
          docker push ${FRONTEND_IMAGE}:${COMMIT_SHA}
          docker push ${FRONTEND_IMAGE}:latest
