name: Build and Push Images

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "prerender.py"
      - ".github/workflows/build.yml"
      - "docker-compose.prod.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build, Scan & Push (Docker Hub)
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'xuvm19' }}/mindcradle-backend
      FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'xuvm19' }}/mindcradle-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.BACKEND_IMAGE }}:latest \
            -f backend/Dockerfile backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_COGNITO_DOMAIN="https://us-east-1fhcz4bfnt.auth.us-east-1.amazoncognito.com" \
            --build-arg VITE_COGNITO_CLIENT_ID="40b9rngks4e3invmigbaje80ng" \
            --build-arg VITE_COGNITO_REDIRECT_URI="https://mindcradle.online/auth/callback" \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.FRONTEND_IMAGE }}:latest \
            -f frontend/Dockerfile .

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: "table"
          severity: "CRITICAL,HIGH"
        continue-on-error: true

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: "table"
          severity: "CRITICAL,HIGH"
        continue-on-error: true

      - name: Push backend image
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:latest

      - name: Push frontend image
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    name: Deploy to EC2
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd "$HOME"
            echo "Current deployment directory: $(pwd)"

            # Detect env file (.env.production or .env)
            ENV_FLAG=""
            if [ -f ".env.production" ]; then
              ENV_FLAG="--env-file .env.production"
            elif [ -f ".env" ]; then
              ENV_FLAG="--env-file .env"
            fi

            # Detect compose file (prioritizing docker-compose.yml)
            COMPOSE_FILE=""
            if [ -f "docker-compose.yml" ]; then
              COMPOSE_FILE="docker-compose.yml"
            elif [ -f "docker-compose.yaml" ]; then
              COMPOSE_FILE="docker-compose.yaml"
            elif [ -f "docker-compose.prod.yml" ]; then
              COMPOSE_FILE="docker-compose.prod.yml"
            fi

            if [ -n "$COMPOSE_FILE" ]; then
              echo "Deploying with $COMPOSE_FILE $ENV_FLAG"
              docker compose -f "$COMPOSE_FILE" $ENV_FLAG pull
              docker compose -f "$COMPOSE_FILE" $ENV_FLAG up -d --remove-orphans
            else
              echo "No compose file found, pulling images directly..."
              docker pull ${{ secrets.DOCKERHUB_USERNAME || 'xuvm19' }}/mindcradle-backend:latest
              docker pull ${{ secrets.DOCKERHUB_USERNAME || 'xuvm19' }}/mindcradle-frontend:latest
              docker restart mindcradle-frontend || true
              docker restart mindcradle-backend || true
            fi

            docker image prune -af --filter "until=24h"

      - name: Verify Deployment Health
        run: |
          echo "Waiting for production services to become healthy..."
          URL="https://mindcradle.online/api/health"
          MAX_RETRIES=15
          DELAY=5

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || true)
            echo "Attempt $i/$MAX_RETRIES: HTTP status code is $HTTP_CODE"
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "Health check passed with HTTP 200 OK!"
              exit 0
            fi
            sleep $DELAY
          done

          echo "Error: Health check failed after $MAX_RETRIES attempts."
          exit 1
